name: Build AML Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Gradle 8.12 / Kotlin ne comprennent pas Java 25 (erreur « 25.0.4.1 ») : on force Java 17.
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create Flutter project structure
        run: |
          if [ ! -f pubspec.yaml ]; then
            cp lib/main.dart /tmp/aml_main.dart

            flutter create \
              --project-name aml_mobile \
              --platforms android,ios \
              .

            cp /tmp/aml_main.dart lib/main.dart
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Save Flutter project to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if ! git diff --cached --quiet; then
            git commit -m "Initialize Flutter project [skip ci]"
            git push
          fi

      - name: Validate Supabase secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: SUPABASE_URL and SUPABASE_ANON_KEY must be configured in GitHub Secrets."
            exit 1
          fi
          echo "Supabase secrets detected."

      # Clé de signature persistante : indispensable pour que Android accepte une mise à jour
      # installée par-dessus la version précédente. Créée une seule fois par create-signing-key.yml.
      - name: Configure release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 est absent : l'APK sera signé avec une clé de debug et la mise à jour dans l'application ne pourra pas s'installer. Lance d'abord le workflow 'Create Android signing key'."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=${{ github.run_number }} \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=AML_BUILD_ID="v1.0.${{ github.run_number }}"

      - name: Prepare APK
        run: cp build/app/outputs/flutter-apk/app-release.apk aml-arena.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aml-android-1.0.${{ github.run_number }}
          path: aml-arena.apk

      # La Release GitHub est ce que lit la mise à jour dans l'application (Profil > Mise à jour AML).
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AML Arena 1.0.${{ github.run_number }}
          body: |
            AML Arena version 1.0.${{ github.run_number }}
          files: aml-arena.apk
          make_latest: true
